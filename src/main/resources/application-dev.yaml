server:
  forward-headers-strategy: framework
  servlet:
    context-path: /${REPO_NAME}
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false
spring:
  config:
    import:
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/oauth2
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/redis
  web:
    resources:
      chain:
        enabled: true
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
          immutable: true
  security:
    oauth2:
      authorizationserver:
        issuer: https://api.${DOMAIN_NAME}/${REPO_NAME}
        client:
          oidc-client:
            registration:
              client-id: "oidc-client"
              client-authentication-methods:
                - "none"
                - "client_secret_basic"
                - "client_secret_post"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
                - "client_credentials"
              redirect-uris:
                - "https://${DOMAIN_NAME}/login/oauth2/code/oidc-client"
                - "https://www.${DOMAIN_NAME}/login/oauth2/code/oidc-client"
                - "${PROJECT_NAME}://oauth/callback"
              post-logout-redirect-uris:
                - "https://${DOMAIN_NAME}/"
                - "https://www.${DOMAIN_NAME}/"
                - "${PROJECT_NAME}://oauth/logout"
              scopes:
                - "openid"
                - "profile"
                - "email"
                - "client.create"
                - "client.read"
            require-authorization-consent: true
            token:
              access-token-time-to-live: 7d
              refresh-token-time-to-live: 30d
              reuse-refresh-tokens: false
              authorization-code-time-to-live: 7d
              device-code-time-to-live: 7d
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            client-name: Google
            provider: google
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${GOOGLE_REDIRECT_URI}
        provider:
          google:
            issuer-uri: https://accounts.google.com
            user-name-attribute: sub
  datasource:
    url: ${DATABASE_URL}
    username: ${AWS_RDS_SECRET_NAME:${DATABASE_USERNAME}}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:com.amazonaws.secretsmanager.sql.AWSSecretsManagerPostgreSQLDriver}
    hikari:
      allow-pool-suspension: true
      maximum-pool-size: ${MAX_POOL_SIZE:2}
      minimum-idle: ${MIN_IDLE:0}
      max-lifetime: 600000
      keepalive-time: 120000
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 3s
      connect-timeout: 5s
      ssl:
        enabled: true
      lettuce:
        pool:
          enabled: false
  session:
    timeout: 30m
    redis:
      namespace: fancia:auth:session
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      gis_admin_password: ${GIS_ADMIN_PASSWORD}
springdoc:
  show-oauth2-endpoints: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true


# Temporary: diagnose OAuth/JWT/session issues (remove after fix)
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    org.springframework.security.oauth2.server.authorization: TRACE
    org.springframework.security.oauth2.server.authorization.oidc: TRACE
    org.springframework.security.oauth2.jwt: TRACE
    org.springframework.session: DEBUG
    org.springframework.data.redis: DEBUG
    io.lettuce.core: INFO
    com.nimbusds.jose: DEBUG
    com.nimbusds.jwt: DEBUG
    com.fancia.backend.auth: DEBUG
