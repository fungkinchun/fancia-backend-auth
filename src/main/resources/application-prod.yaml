server:
  servlet:
    context-path: /${REPO_NAME}
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
spring:
  config:
    import:
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/oauth2
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/redis
  security:
    oauth2:
      authorizationserver:
        client:
          oidc-client:
            registration:
              client-id: "oidc-client"
              client-authentication-methods:
                - "none"
                - "client_secret_basic"
                - "client_secret_post"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
                - "client_credentials"
              redirect-uris:
                - "http://${DOMAIN_NAME}/login/oauth2/code/oidc-client"
              post-logout-redirect-uris:
                - "http://${DOMAIN_NAME}/"
              scopes:
                - "openid"
                - "profile"
                - "email"
                - "client.create"
                - "client.read"
            require-authorization-consent: true
            token:
              access-token-time-to-live: 7d
              refresh-token-time-to-live: 30d
              reuse-refresh-tokens: false
              authorization-code-time-to-live: 7d
              device-code-time-to-live: 7d
  datasource:
    url: ${DATABASE_URL}
    username: ${AWS_RDS_SECRET_NAME:${DATABASE_USERNAME}}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:com.amazonaws.secretsmanager.sql.AWSSecretsManagerPostgreSQLDriver}
    hikari:
      allow-pool-suspension: true
      maximum-pool-size: ${MAX_POOL_SIZE:2}
      minimum-idle: ${MIN_IDLE:0}
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 480000
      keepalive-time: 120000
  data:
    redis:
      # Must be rediss:// for Upstash (TLS required)
      url: ${REDIS_URL}
      timeout: 3s
      connect-timeout: 5s
      ssl:
        enabled: true
      lettuce:
        pool:
          enabled: false
  session:
    timeout: 30m
    redis:
      namespace: fancia:auth:session
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      gis_admin_password: ${GIS_ADMIN_PASSWORD}
springdoc:
  show-oauth2-endpoints: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
